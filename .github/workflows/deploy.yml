name: Deploy to production

# Every push to main goes live on clippifi.com. The repo is private and Vercel's
# free plan only auto-deploys commits by the account owner, so GitHub deploys
# with the Vercel CLI instead (same as `vercel deploy --prod` from a laptop).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not secret: they only say which Vercel project to deploy. The token is the secret.
  VERCEL_ORG_ID: team_7TehXoJKoqMEUt4m9WaFRR8t
  VERCEL_PROJECT_ID: prj_ukH9lfTfAQI1W5nQ4QZAv6YvkWED

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel builds the app on its side (runs migrations, then next build).
      - name: Deploy
        run: npx --yes vercel@65.16.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
